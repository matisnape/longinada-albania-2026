name: Publish redirect

# The trip's content moved to the repo matisnape/cycling_trips.
# This repo stays as an archive of the history; all it publishes now is a redirect
# from the old address to https://anks.pl/cycling_trips/albania-2026/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
