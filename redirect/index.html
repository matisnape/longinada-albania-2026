<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strona przeniesiona — Góry Przeklęte</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://anks.pl/cycling_trips/albania-2026/">
<!-- Browsers without JS: the trip's home page after 2 s. With the script the move is
     immediate and lands on the exact subpage, so it wins the race. -->
<meta http-equiv="refresh" content="2;url=https://anks.pl/cycling_trips/albania-2026/">
<style>
  :root{--accent:#2f6e78}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:#1d2321;background:#f6f4ef;padding:24px}
  main{max-width:30rem;text-align:center}
  h1{font-size:1.5rem;margin:0 0 .6em;color:var(--accent)}
  p{margin:0 0 1em;color:#4a524f}
  a.btn{display:inline-block;padding:10px 18px;border-radius:999px;
        background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
  a.btn:hover{background:#255860}
</style>
<body>
  <main>
    <h1>Strona przeniesiona</h1>
    <p>Notatki z wyprawy „Góry Przeklęte” mieszkają teraz razem z pozostałymi wyprawami.</p>
    <p><a class="btn" id="target" href="https://anks.pl/cycling_trips/albania-2026/">Przejdź do nowej strony</a></p>
  </main>
  <script>
    // Keep the path: /<old-repo>/dzien-3.html -> https://anks.pl/cycling_trips/albania-2026/ + dzien-3.html
    var base = "https://anks.pl/cycling_trips/albania-2026/";
    var rest = location.pathname.split("/").slice(2).join("/");
    var url = base + rest + location.search + location.hash;
    document.getElementById("target").href = url;
    location.replace(url);
  </script>
